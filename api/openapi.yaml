openapi: 3.1.0

# =============================================================================
# カロリー管理アプリ API 仕様
#
# このファイルが API の唯一の正である。
# Java 実装（:8080）と Kotlin 実装（:8081）は、どちらもこの契約を満たす。
#
# 【変更手順】
#   1. このファイルを直す
#   2. Java 実装を追従させる
#   3. Kotlin 実装を追従させる（Phase 2 以降）
#   4. 契約テストを両方に対して流す
# 実装を先に書いてはならない。仕様が揺れると 2 実装の比較が成立しなくなる。
# =============================================================================

info:
  title: カロリー管理アプリ API
  version: 0.1.0
  description: |
    食事・体組成・運動を記録し、栄養収支を可視化するアプリケーションの API。

    Phase 0 の時点では認証エンドポイントのみを定義している。
    食事記録・集計は Phase 1 で追加する。

servers:
  - url: http://localhost:8080/api
    description: Java 実装（Web フロント向け）
  - url: http://localhost:8081/api
    description: Kotlin 実装（モバイル向け・Phase 2 以降）

tags:
  - name: auth
    description: 認証とアカウント
  - name: foods
    description: 食品マスタ
  - name: profile
    description: 身体情報
  - name: goals
    description: 目標カロリーと目標 PFC
  - name: body-records
    description: 体重・体脂肪率の記録
  - name: meal-logs
    description: 食事の記録
  - name: summaries
    description: 栄養集計

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: 新規登録
      description: |
        ユーザーを登録し、そのままログイン状態にするためのトークン一式を返す。
        メールアドレスは小文字に正規化して保存されるため、大文字違いは同一とみなす。
      operationId: signUp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: メールアドレスが既に使われている
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: EMAIL_ALREADY_USED
                message: このメールアドレスは既に登録されています。

  /auth/login:
    post:
      tags: [auth]
      summary: ログイン
      description: |
        認証に失敗した場合、「ユーザーが存在しない」と「パスワードが違う」を
        区別できる情報は返さない。メールアドレスの存在推測を防ぐため、
        応答本文も応答時間も同一にする。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_CREDENTIALS
                message: メールアドレスまたはパスワードが正しくありません。

  /auth/refresh:
    post:
      tags: [auth]
      summary: トークン更新
      description: |
        リフレッシュトークンを新しいトークン一式と交換する。
        使用したリフレッシュトークンはその場で失効する（ローテーション）ため、
        同じトークンで 2 回続けて更新することはできない。
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: リフレッシュトークンが無効、失効済み、または期限切れ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: INVALID_REFRESH_TOKEN
                message: リフレッシュトークンが無効です。再度ログインしてください。

  /auth/logout:
    post:
      tags: [auth]
      summary: ログアウト
      description: |
        渡されたリフレッシュトークンを失効させる。
        存在しないトークンを渡された場合もエラーにせず 204 を返す（冪等）。
        アクセストークンは自己完結型のため、有効期限までは失効しない。
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: ログアウト完了
        '400':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [auth]
      summary: ログイン中のユーザー情報
      operationId: getCurrentUser
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # 食品マスタ
  # ---------------------------------------------------------------------------

  /foods:
    get:
      tags: [foods]
      summary: 食品を検索する
      description: |
        食品名の部分一致で検索する。共有マスタ（SEED / MEXT / OFF）に加えて、
        ログイン中のユーザー自身が登録した食品（USER）も対象に含む。
        他人が登録した USER food は決して返さない。
      operationId: searchFoods
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
          description: 検索語。食品名に対する部分一致。
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: 検索結果。該当なしの場合は空配列。
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Food' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [foods]
      summary: 独自の食品を登録する
      description: |
        マスタに無い食品をユーザーが登録する。`source` は USER に固定され、
        登録者本人の検索にのみ現れる。栄養値は可食部 100g あたりで指定する。
      operationId: createFood
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoodCreateRequest' }
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Food' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # プロフィールと目標
  # ---------------------------------------------------------------------------

  /profile:
    get:
      tags: [profile]
      summary: プロフィールを取得する
      operationId: getProfile
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: プロフィール未設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                code: PROFILE_NOT_FOUND
                message: プロフィールが未設定です。

    put:
      tags: [profile]
      summary: プロフィールを登録・更新する
      description: 未登録なら作成、登録済みなら更新する（upsert）。
      operationId: upsertProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Profile' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /goals/suggestion:
    get:
      tags: [goals]
      summary: 目標カロリーの提案を計算する
      description: |
        プロフィールと最新の体重記録から Mifflin-St Jeor 式で BMR / TDEE を求め、
        目標カロリーと目標 PFC を提案する。**保存はしない。**

        算出結果が BMR を下回る場合は BMR で打ち切り、`cappedAtBmr` を true にする。
        減量ペースが非現実的であることを画面で伝えられるようにするため。

        プロフィールまたは体重記録が無い場合は 409 を返す。計算に必要な入力が
        揃っていないことを、検証エラーとは区別して伝える。
      operationId: getGoalSuggestion
      parameters:
        - name: paceKgPerMonth
          in: query
          schema: { type: number, format: double, minimum: 0, maximum: 4, default: 2 }
          description: 1 か月あたりの目標減量キログラム数。0 なら体重維持。
      responses:
        '200':
          description: 算出成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoalSuggestion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 算出に必要なプロフィールまたは体重記録が無い
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                code: PROFILE_REQUIRED
                message: 目標を算出するには、先にプロフィールと体重を登録してください。

  /goals/current:
    get:
      tags: [goals]
      summary: 現在有効な目標を取得する
      description: 今日の日付以前で最も新しい start_on を持つ目標を返す。
      operationId: getCurrentGoal
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 目標が未設定
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }

  /goals:
    put:
      tags: [goals]
      summary: 目標を確定して保存する
      description: |
        同じ開始日の目標が既にある場合は上書きする。開始日が異なる場合は
        履歴として別の行を作る。過去の達成率を後から計算し直せるようにするため、
        古い目標は消さない。
      operationId: putGoal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoalRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Goal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # 体重記録
  # ---------------------------------------------------------------------------

  /body-records:
    get:
      tags: [body-records]
      summary: 体重の推移を取得する
      operationId: listBodyRecords
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 記録のある日だけを日付昇順で返す
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BodyRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /body-records/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    put:
      tags: [body-records]
      summary: 体重を記録する
      description: 1 日 1 レコード。同じ日に再度記録した場合は上書きする（upsert）。
      operationId: putBodyRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BodyRecordRequest' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BodyRecord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    delete:
      tags: [body-records]
      summary: 体重記録を削除する
      operationId: deleteBodyRecord
      responses:
        '204': { description: 削除完了。元から無い場合も 204（冪等）。 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------------------
  # 食事記録
  # ---------------------------------------------------------------------------

  /meal-logs:
    get:
      tags: [meal-logs]
      summary: 指定日の食事記録を取得する
      operationId: listMealLogs
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 食事区分順に返す
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MealLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [meal-logs]
      summary: 食事を記録する
      description: |
        クライアントは食品 ID と分量だけを送る。**栄養値はサーバーが計算する。**
        計算式がクライアントとサーバーに二重に存在すると、Web とモバイルで
        結果がずれる余地が生まれるため。

        計算した栄養値は記録側の行にスナップショットとして保存され、
        以後マスタが改訂されても過去の記録は変わらない。
      operationId: createMealLog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MealLogRequest' }
      responses:
        '201':
          description: 記録成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 指定された食品が存在しない、または参照できない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example:
                code: FOOD_NOT_FOUND
                message: 指定された食品が見つかりません。

  /meal-logs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    delete:
      tags: [meal-logs]
      summary: 食事記録を削除する
      description: |
        他人の記録の ID を指定した場合は 403 ではなく **404** を返す。
        403 だと「その ID は存在する」ことを教えてしまうため。
      operationId: deleteMealLog
      responses:
        '204': { description: 削除完了 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------------------
  # 集計
  # ---------------------------------------------------------------------------

  /summaries/daily:
    get:
      tags: [summaries]
      summary: 指定日の栄養集計
      description: |
        ダッシュボードの主データ。摂取合計、目標、差分、食事区分ごとの内訳を返す。
        目標が未設定の場合、`goal` と `remaining` は null になる（エラーにはしない）。
      operationId: getDailySummary
      parameters:
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 集計結果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailySummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /summaries/range:
    get:
      tags: [summaries]
      summary: 期間の日別推移
      description: |
        グラフ用。指定期間のすべての日を返す（記録が無い日は 0 kcal として含む）。
        体重は記録のある日のみ値を持ち、あわせて 7 日移動平均を返す。
        体重は日々 1kg 前後変動するため、生の値だけでは傾向が読めないことによる。
      operationId: getRangeSummary
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: 日別の推移
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RangeSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    SignUpRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          examples: ['taro@example.com']
        password:
          type: string
          format: password
          minLength: 8
          description: |
            8 文字以上。BCrypt の制約により UTF-8 で 72 バイトを超えると
            400（PASSWORD_TOO_LONG）になる。
          examples: ['password1234']
        displayName:
          type: string
          maxLength: 50
          examples: ['山田太郎']

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
          description: JWT（HS256）。Authorization ヘッダに Bearer として付ける。
        refreshToken:
          type: string
          description: ランダム文字列。サーバー側に実体があり、失効させられる。
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          format: int64
          description: アクセストークンの有効期間（秒）
          examples: [1800]

    UserResponse:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        displayName:
          type: string
        createdAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # 食品
    # -------------------------------------------------------------------------

    Nutrition:
      type: object
      description: 栄養値。food では可食部 100g あたり、記録では実際に摂取した量に対する値。
      required: [kcal, proteinG, fatG, carbG]
      properties:
        kcal:      { type: number, format: double, minimum: 0 }
        proteinG:  { type: number, format: double, minimum: 0 }
        fatG:      { type: number, format: double, minimum: 0 }
        carbG:     { type: number, format: double, minimum: 0 }
        saltG:     { type: [number, 'null'], format: double, minimum: 0 }
        fiberG:    { type: [number, 'null'], format: double, minimum: 0 }
        sugarG:    { type: [number, 'null'], format: double, minimum: 0 }

    FoodSource:
      type: string
      enum: [SEED, MEXT, OFF, USER]
      description: |
        食品データの出所。
        * `SEED` — Phase 1 で投入した代表値。**おおよその値であり、正確な栄養計算には使えない。**
        * `MEXT` — 日本食品標準成分表から取り込んだ値（Phase 3）
        * `OFF`  — Open Food Facts 由来（Phase 3）
        * `USER` — ユーザーが手動登録した食品。登録者本人にのみ見える。

    Food:
      type: object
      required: [id, source, name, nutritionPer100g]
      properties:
        id:       { type: integer, format: int64 }
        source:   { $ref: '#/components/schemas/FoodSource' }
        name:     { type: string, examples: ['ごはん（精白米）'] }
        nameKana: { type: [string, 'null'] }
        category: { type: [string, 'null'], examples: ['穀類'] }
        nutritionPer100g: { $ref: '#/components/schemas/Nutrition' }

    FoodCreateRequest:
      type: object
      required: [name, nutritionPer100g]
      properties:
        name:     { type: string, minLength: 1, maxLength: 200 }
        nameKana: { type: [string, 'null'], maxLength: 200 }
        category: { type: [string, 'null'], maxLength: 100 }
        nutritionPer100g: { $ref: '#/components/schemas/Nutrition' }

    # -------------------------------------------------------------------------
    # プロフィールと目標
    # -------------------------------------------------------------------------

    Sex:
      type: string
      enum: [MALE, FEMALE]
      description: Mifflin-St Jeor 式が男女で異なる定数を使うため、この 2 値のみ。

    ActivityLevel:
      type: string
      enum: [SEDENTARY, LIGHT, MODERATE, ACTIVE, VERY_ACTIVE]
      description: TDEE の活動係数。順に 1.2 / 1.375 / 1.55 / 1.725 / 1.9。

    ProfileRequest:
      type: object
      required: [sex, birthDate, heightCm, activityLevel]
      properties:
        sex:           { $ref: '#/components/schemas/Sex' }
        birthDate:     { type: string, format: date }
        heightCm:      { type: number, format: double, minimum: 50, maximum: 250 }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }

    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileRequest'
        - type: object
          required: [age]
          properties:
            age:
              type: integer
              description: 生年月日から算出した現在の年齢。クライアントで計算させない。

    GoalSuggestion:
      type: object
      required: [bmr, tdee, targetKcal, targetProteinG, targetFatG, targetCarbG, paceKgPerMonth, cappedAtBmr, basedOnWeightKg]
      properties:
        bmr:
          type: integer
          description: 基礎代謝量（kcal/日）。Mifflin-St Jeor 式による。
        tdee:
          type: integer
          description: 総消費カロリー（kcal/日）。BMR × 活動係数。
        targetKcal:      { type: integer }
        targetProteinG:  { type: number, format: double }
        targetFatG:      { type: number, format: double }
        targetCarbG:     { type: number, format: double }
        paceKgPerMonth:  { type: number, format: double }
        cappedAtBmr:
          type: boolean
          description: |
            true の場合、指定した減量ペースでは目標が BMR を下回るため
            BMR で打ち切っている。画面で「このペースは達成できない」と伝えること。
        basedOnWeightKg:
          type: number
          format: double
          description: 算出に使った体重。プロフィールではなく体重記録の最新値。

    GoalRequest:
      type: object
      required: [targetKcal, targetProteinG, targetFatG, targetCarbG]
      properties:
        startOn:
          type: [string, 'null']
          format: date
          description: 省略した場合は今日。
        targetKcal:      { type: integer, minimum: 500, maximum: 10000 }
        targetProteinG:  { type: number, format: double, minimum: 0 }
        targetFatG:      { type: number, format: double, minimum: 0 }
        targetCarbG:     { type: number, format: double, minimum: 0 }
        paceKgPerMonth:  { type: [number, 'null'], format: double }

    Goal:
      type: object
      required: [id, startOn, targetKcal, targetProteinG, targetFatG, targetCarbG]
      properties:
        id:              { type: integer, format: int64 }
        startOn:         { type: string, format: date }
        targetKcal:      { type: integer }
        targetProteinG:  { type: number, format: double }
        targetFatG:      { type: number, format: double }
        targetCarbG:     { type: number, format: double }
        paceKgPerMonth:  { type: [number, 'null'], format: double }

    # -------------------------------------------------------------------------
    # 体重
    # -------------------------------------------------------------------------

    BodyRecordRequest:
      type: object
      required: [weightKg]
      properties:
        weightKg:   { type: number, format: double, minimum: 20, maximum: 300 }
        bodyFatPct: { type: [number, 'null'], format: double, minimum: 1, maximum: 70 }

    BodyRecord:
      type: object
      required: [recordedOn, weightKg]
      properties:
        recordedOn: { type: string, format: date }
        weightKg:   { type: number, format: double }
        bodyFatPct: { type: [number, 'null'], format: double }

    # -------------------------------------------------------------------------
    # 食事記録
    # -------------------------------------------------------------------------

    MealType:
      type: string
      enum: [BREAKFAST, LUNCH, DINNER, SNACK]

    MealLogItemRequest:
      type: object
      required: [foodId, amountG]
      properties:
        foodId:  { type: integer, format: int64 }
        amountG: { type: number, format: double, exclusiveMinimum: 0, maximum: 10000 }

    MealLogRequest:
      type: object
      required: [eatenOn, mealType, items]
      properties:
        eatenOn:  { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        note:     { type: [string, 'null'], maxLength: 500 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/MealLogItemRequest' }

    MealLogItem:
      type: object
      description: |
        栄養値は登録時点のスナップショット。食品マスタが改訂されても、
        既存の記録のこれらの値は変わらない。
      required: [id, foodName, amountG, nutrition]
      properties:
        id:       { type: integer, format: int64 }
        foodId:
          type: [integer, 'null']
          format: int64
          description: マスタから食品が削除された場合は null になるが、記録自体は残る。
        foodName: { type: string }
        amountG:  { type: number, format: double }
        nutrition: { $ref: '#/components/schemas/Nutrition' }

    MealLog:
      type: object
      required: [id, eatenOn, mealType, items, total]
      properties:
        id:       { type: integer, format: int64 }
        eatenOn:  { type: string, format: date }
        mealType: { $ref: '#/components/schemas/MealType' }
        note:     { type: [string, 'null'] }
        items:
          type: array
          items: { $ref: '#/components/schemas/MealLogItem' }
        total:
          allOf: [{ $ref: '#/components/schemas/Nutrition' }]
          description: この食事の合計。

    # -------------------------------------------------------------------------
    # 集計
    # -------------------------------------------------------------------------

    MealTypeTotal:
      type: object
      required: [mealType, total]
      properties:
        mealType: { $ref: '#/components/schemas/MealType' }
        total:    { $ref: '#/components/schemas/Nutrition' }

    DailySummary:
      type: object
      required: [date, total, byMealType]
      properties:
        date:  { type: string, format: date }
        total: { $ref: '#/components/schemas/Nutrition' }
        byMealType:
          type: array
          description: 記録のある食事区分のみ。朝食・昼食・夕食・間食の順。
          items: { $ref: '#/components/schemas/MealTypeTotal' }
        goal:
          oneOf:
            - $ref: '#/components/schemas/Goal'
            - type: 'null'
          description: 目標が未設定なら null。エラーにはしない。
        remaining:
          oneOf:
            - $ref: '#/components/schemas/Nutrition'
            - type: 'null'
          description: |
            目標 − 摂取。目標未設定なら null。
            超過している場合は負の値になる（0 で切り上げない）。
        weightKg:
          type: [number, 'null']
          format: double
          description: その日の体重記録。無ければ null。

    DailyPoint:
      type: object
      required: [date, kcal, proteinG, fatG, carbG]
      properties:
        date:      { type: string, format: date }
        kcal:      { type: number, format: double }
        proteinG:  { type: number, format: double }
        fatG:      { type: number, format: double }
        carbG:     { type: number, format: double }
        targetKcal:
          type: [integer, 'null']
          description: その日に有効だった目標。目標は履歴で持つため日ごとに変わりうる。
        weightKg:
          type: [number, 'null']
          format: double
          description: 実測値。記録が無い日は null。
        weightMovingAvgKg:
          type: [number, 'null']
          format: double
          description: |
            直近 7 日間の記録のある日だけで計算した移動平均。
            記録が 1 件も無い期間は null。

    RangeSummary:
      type: object
      required: [from, to, days]
      properties:
        from: { type: string, format: date }
        to:   { type: string, format: date }
        days:
          type: array
          description: 指定期間のすべての日。記録が無い日も 0 kcal として含む。
          items: { $ref: '#/components/schemas/DailyPoint' }

    ApiError:
      type: object
      required: [code, message]
      description: |
        すべてのエラー応答はこの形式で返す。Java 実装と Kotlin 実装で
        形が揺れると、生成されたクライアントが両対応できなくなる。
      properties:
        code:
          type: string
          description: プログラムから分岐するための機械可読なコード
          examples: ['INVALID_CREDENTIALS']
        message:
          type: string
          description: 画面にそのまま表示できる日本語メッセージ
        errors:
          type: array
          description: 入力検証エラーの明細。検証エラー以外では省略される。
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          examples: ['email']
        message:
          type: string
          examples: ['メールアドレスの形式が正しくありません']

  responses:
    ValidationError:
      description: 入力内容が不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: VALIDATION_ERROR
            message: 入力内容に誤りがあります。
            errors:
              - field: email
                message: 電子メールアドレスとして正しい形式にしてください
              - field: password
                message: パスワードは 8 文字以上 72 文字以下にしてください

    Unauthorized:
      description: 認証が必要、またはトークンが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHORIZED
            message: 認証が必要です。

    NotFound:
      description: |
        対象が存在しない。他人のリソースを指定した場合もこれを返す。
        403 だと「その ID は存在する」ことを教えてしまうため。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: 対象が見つかりません。

security:
  - bearerAuth: []
