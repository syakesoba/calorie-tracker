# テスト実行時の設定。開発用の calorie ではなく calorie_test を使う。
# テスト前に `docker compose up -d db` で DB が起動している必要がある。

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:55432}/${TEST_DB_NAME:calorie_test}
    username: ${JAVA_DB_USER:app_java}
    password: ${JAVA_DB_PASSWORD:app_java_pw}

  flyway:
    enabled: true
    # テスト DB のスキーマが古い状態で残っていても、常に作り直して現在の
    # マイグレーションと一致させる。開発 DB では絶対に有効にしないこと。
    clean-disabled: false
    clean-on-validation-error: true

app:
  jwt:
    secret: test-only-signing-key-must-be-at-least-32-bytes-long
    access-token-minutes: 30
    refresh-token-days: 30

logging:
  level:
    com.example.calorie: INFO
    org.springframework.web: WARN
